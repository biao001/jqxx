<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <title>Optimizations</title>
  <defs>
    <linearGradient id="gradBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6AA1FF"/>
      <stop offset="100%" stop-color="#2F5ACC"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9883F3"/>
      <stop offset="100%" stop-color="#4A38B0"/>
    </linearGradient>
    <linearGradient id="gradBlueFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#DDE3FF"/>
    </linearGradient>
    <linearGradient id="gradPurpleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3EEFF"/>
      <stop offset="100%" stop-color="#E4DAFD"/>
    </linearGradient>
    <linearGradient id="gradDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2040"/>
      <stop offset="100%" stop-color="#0B1028"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6B4FD9" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A7BF5"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B4FD9"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5BFEB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#F5F7FF"/>

<rect x="60" y="40" width="6" height="30" fill="#4A7BF5" rx="2"/>
<text x="74" y="64" text-anchor="start" style="font-size:22px;fill:#1F2937;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">算法优化策略</text>
<text x="74" y="86" text-anchor="start" style="font-size:12px;fill:#6B7280;font-weight:400;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">五大优化维度 · 从 CPU 4 FPS 到 50+ FPS 的路径</text>
<line x1="74" y1="96" x2="920" y2="96" stroke="#D5D8E6" stroke-width="1"/>
<circle cx="922" cy="96" r="4" fill="#4A7BF5"/>
<rect x="1420" y="40" width="7" height="7" fill="#6B4FD9"/>
<rect x="1430" y="40" width="7" height="7" fill="#4A7BF5"/>
<rect x="1440" y="40" width="7" height="7" fill="#D9CEF8"/>
<rect x="1450" y="40" width="7" height="7" fill="#6B4FD9"/>
<rect x="1420" y="50" width="7" height="7" fill="#4A7BF5"/>
<rect x="1430" y="50" width="7" height="7" fill="#D9CEF8"/>
<rect x="1440" y="50" width="7" height="7" fill="#6B4FD9"/>
<rect x="1450" y="50" width="7" height="7" fill="#4A7BF5"/>
<rect x="1420" y="60" width="7" height="7" fill="#D9CEF8"/>
<rect x="1430" y="60" width="7" height="7" fill="#6B4FD9"/>
<rect x="1440" y="60" width="7" height="7" fill="#4A7BF5"/>
<rect x="1450" y="60" width="7" height="7" fill="#D9CEF8"/>
<circle cx="1495" cy="60" r="22" fill="#EEEFF8"/>
<circle cx="1495" cy="60" r="17" fill="#2D387A"/>
<circle cx="1495" cy="60" r="12" fill="#0F1640"/>
<circle cx="1498" cy="57" r="4" fill="#4A7BF5"/>
<rect x="60" y="140" width="1480" height="80" rx="12" ry="12" fill="#0F172A" stroke="#E5E7FF" stroke-width="1"/>
<circle cx="150" cy="180" r="22" fill="#94A3B8" stroke="#FFFFFF" stroke-width="3"/>
<text x="150" y="186" text-anchor="middle" style="font-size:16px;fill:#FFFFFF;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">◆</text>
<text x="150" y="155" text-anchor="middle" style="font-size:13px;fill:#E2E8F0;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">原始方案</text>
<text x="150" y="210" text-anchor="middle" style="font-size:13px;fill:#94A3B8;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">60 ms  |  16 FPS</text>
<circle cx="580" cy="180" r="22" fill="#4A7BF5" stroke="#FFFFFF" stroke-width="3"/>
<text x="580" y="186" text-anchor="middle" style="font-size:16px;fill:#FFFFFF;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">◆</text>
<text x="580" y="155" text-anchor="middle" style="font-size:13px;fill:#E2E8F0;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">标准优化</text>
<text x="580" y="210" text-anchor="middle" style="font-size:13px;fill:#4A7BF5;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">35 ms  |  28 FPS</text>
<circle cx="1020" cy="180" r="22" fill="#22C55E" stroke="#FFFFFF" stroke-width="3"/>
<text x="1020" y="186" text-anchor="middle" style="font-size:16px;fill:#FFFFFF;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">◆</text>
<text x="1020" y="155" text-anchor="middle" style="font-size:13px;fill:#E2E8F0;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">极致加速</text>
<text x="1020" y="210" text-anchor="middle" style="font-size:13px;fill:#22C55E;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">18 ms  |  50+ FPS</text>
<line x1="172" y1="180" x2="558" y2="180" stroke="#4A7BF5" stroke-width="3" stroke-linecap="round"/>
<line x1="602" y1="180" x2="998" y2="180" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
<text x="1360" y="186" text-anchor="middle" style="font-size:13px;fill:#CBD5E1;font-weight:600;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">目标 &gt;15 FPS 实时</text>
<rect x="60" y="250" width="290" height="240" rx="12" ry="12" fill="#FFFFFF" stroke="#E5E7FF" stroke-width="1" filter="url(#soft)"/>
<circle cx="90" cy="280" r="20" fill="url(#gradBlue)"/>
<text x="90" y="284" text-anchor="middle" style="font-size:12px;fill:#FFFFFF;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">01</text>
<text x="120" y="286" text-anchor="start" style="font-size:15px;fill:#1F2937;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">推理分辨率下降</text>
<rect x="74" y="305" width="32" height="3" fill="#4A7BF5" rx="1.5"/>
<text x="76" y="335" text-anchor="start" style="font-size:12px;fill:#2F5ACC;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">imgsz 640 → 384</text>
<rect x="76" y="346" width="200" height="22" rx="11.0" ry="11.0" fill="#22C55E"/>
<text x="176.0" y="360.96" text-anchor="middle" style="font-size:11px;fill:#FFFFFF;font-weight:600;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">–42% 延迟</text>
<circle cx="82" cy="386" r="2.5" fill="#4A7BF5"/>
<text x="92" y="390" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">640×640: 62 ms</text>
<circle cx="82" cy="406" r="2.5" fill="#4A7BF5"/>
<text x="92" y="410" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">384×384: 36 ms</text>
<circle cx="82" cy="426" r="2.5" fill="#4A7BF5"/>
<text x="92" y="430" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">256×256: 30 ms</text>
<circle cx="82" cy="446" r="2.5" fill="#4A7BF5"/>
<text x="92" y="450" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">小物体召回略降 1-2%</text>
<rect x="358" y="250" width="290" height="240" rx="12" ry="12" fill="#FFFFFF" stroke="#E5E7FF" stroke-width="1" filter="url(#soft)"/>
<circle cx="388" cy="280" r="20" fill="url(#gradPurple)"/>
<text x="388" y="284" text-anchor="middle" style="font-size:12px;fill:#FFFFFF;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">02</text>
<text x="418" y="286" text-anchor="start" style="font-size:15px;fill:#1F2937;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">驾驶员 Crop</text>
<rect x="372" y="305" width="32" height="3" fill="#6B4FD9" rx="1.5"/>
<text x="374" y="335" text-anchor="start" style="font-size:12px;fill:#2F5ACC;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">人体 bbox + 10% padding</text>
<rect x="374" y="346" width="200" height="22" rx="11.0" ry="11.0" fill="#22C55E"/>
<text x="474.0" y="360.96" text-anchor="middle" style="font-size:11px;fill:#FFFFFF;font-weight:600;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">smoking 专用模型 –20% 延迟</text>
<circle cx="380" cy="386" r="2.5" fill="#6B4FD9"/>
<text x="390" y="390" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">避免整图跑大模型</text>
<circle cx="380" cy="406" r="2.5" fill="#6B4FD9"/>
<text x="390" y="410" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">crop 尺寸 ≈ 原 40%</text>
<circle cx="380" cy="426" r="2.5" fill="#6B4FD9"/>
<text x="390" y="430" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">保留上下文 padding</text>
<circle cx="380" cy="446" r="2.5" fill="#6B4FD9"/>
<text x="390" y="450" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">精度不降反升（背景少）</text>
<rect x="656" y="250" width="290" height="240" rx="12" ry="12" fill="#FFFFFF" stroke="#E5E7FF" stroke-width="1" filter="url(#soft)"/>
<circle cx="686" cy="280" r="20" fill="url(#gradBlue)"/>
<text x="686" y="284" text-anchor="middle" style="font-size:12px;fill:#FFFFFF;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">03</text>
<text x="716" y="286" text-anchor="start" style="font-size:15px;fill:#1F2937;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">跳帧策略</text>
<rect x="670" y="305" width="32" height="3" fill="#4A7BF5" rx="1.5"/>
<text x="672" y="335" text-anchor="start" style="font-size:12px;fill:#2F5ACC;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">infer_every=N 中间帧复用</text>
<rect x="672" y="346" width="200" height="22" rx="11.0" ry="11.0" fill="#22C55E"/>
<text x="772.0" y="360.96" text-anchor="middle" style="font-size:11px;fill:#FFFFFF;font-weight:600;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">FPS 近线性 ×N</text>
<circle cx="678" cy="386" r="2.5" fill="#4A7BF5"/>
<text x="688" y="390" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">N=1 每帧精细</text>
<circle cx="678" cy="406" r="2.5" fill="#4A7BF5"/>
<text x="688" y="410" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">N=2 显示端 50+ FPS</text>
<circle cx="678" cy="426" r="2.5" fill="#4A7BF5"/>
<text x="688" y="430" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">N=3 约 70 FPS</text>
<circle cx="678" cy="446" r="2.5" fill="#4A7BF5"/>
<text x="688" y="450" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">吸烟等慢动作完全兼容</text>
<rect x="210" y="510" width="290" height="240" rx="12" ry="12" fill="#FFFFFF" stroke="#E5E7FF" stroke-width="1" filter="url(#soft)"/>
<circle cx="240" cy="540" r="20" fill="url(#gradPurple)"/>
<text x="240" y="544" text-anchor="middle" style="font-size:12px;fill:#FFFFFF;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">04</text>
<text x="270" y="546" text-anchor="start" style="font-size:15px;fill:#1F2937;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">低光 CLAHE</text>
<rect x="224" y="565" width="32" height="3" fill="#6B4FD9" rx="1.5"/>
<text x="226" y="595" text-anchor="start" style="font-size:12px;fill:#2F5ACC;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">YUV Y 通道自适应均衡</text>
<rect x="226" y="606" width="200" height="22" rx="11.0" ry="11.0" fill="#22C55E"/>
<text x="326.0" y="620.96" text-anchor="middle" style="font-size:11px;fill:#FFFFFF;font-weight:600;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">暗场景召回 +15%</text>
<circle cx="232" cy="646" r="2.5" fill="#6B4FD9"/>
<text x="242" y="650" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">只在 mean&lt;80 触发</text>
<circle cx="232" cy="666" r="2.5" fill="#6B4FD9"/>
<text x="242" y="670" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">tile 8×8 clip=3.0</text>
<circle cx="232" cy="686" r="2.5" fill="#6B4FD9"/>
<text x="242" y="690" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">车内夜视关键</text>
<circle cx="232" cy="706" r="2.5" fill="#6B4FD9"/>
<text x="242" y="710" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">开销仅 +3 ms</text>
<rect x="508" y="510" width="290" height="240" rx="12" ry="12" fill="#FFFFFF" stroke="#E5E7FF" stroke-width="1" filter="url(#soft)"/>
<circle cx="538" cy="540" r="20" fill="url(#gradBlue)"/>
<text x="538" y="544" text-anchor="middle" style="font-size:12px;fill:#FFFFFF;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">05</text>
<text x="568" y="546" text-anchor="start" style="font-size:15px;fill:#1F2937;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">统一多类模型</text>
<rect x="522" y="565" width="32" height="3" fill="#4A7BF5" rx="1.5"/>
<text x="524" y="595" text-anchor="start" style="font-size:12px;fill:#2F5ACC;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">3 模型 → 1 个 yolov8n</text>
<rect x="524" y="606" width="200" height="22" rx="11.0" ry="11.0" fill="#22C55E"/>
<text x="624.0" y="620.96" text-anchor="middle" style="font-size:11px;fill:#FFFFFF;font-weight:600;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">–70% 总延迟</text>
<circle cx="530" cy="646" r="2.5" fill="#4A7BF5"/>
<text x="540" y="650" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">原: YOLO + v11m smoke + seatbelt</text>
<circle cx="530" cy="666" r="2.5" fill="#4A7BF5"/>
<text x="540" y="670" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">新: 单个 6MB 模型覆盖</text>
<circle cx="530" cy="686" r="2.5" fill="#4A7BF5"/>
<text x="540" y="690" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">参数减 7 倍</text>
<circle cx="530" cy="706" r="2.5" fill="#4A7BF5"/>
<text x="540" y="710" text-anchor="start" style="font-size:10.5px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">精度相当，速度大幅提升</text>
<rect x="970" y="730" width="570" height="120" rx="12" ry="12" fill="url(#gradBlueFill)" stroke="#4A7BF5" stroke-width="1" filter="url(#soft)"/>
<text x="990" y="756" text-anchor="start" style="font-size:14px;fill:#2F5ACC;font-weight:700;font-family:'Microsoft YaHei', 'SF Pro SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;">🔢 综合 FPS 近似公式</text>
<rect x="990" y="768" width="530" height="36" rx="8" ry="8" fill="#FFFFFF" stroke="#4A7BF5" stroke-width="1.5"/>
<text x="1255.0" y="790.32" text-anchor="middle" style="font-size:14px;fill:#2F5ACC;font-weight:700;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">FPS_eff  ≈  N / ( t_det + t_pose + t_rule + t_draw )</text>
<text x="990" y="823" text-anchor="start" style="font-size:12px;fill:#4B5563;font-weight:400;font-family:'JetBrains Mono', Consolas, 'SF Mono', monospace;">优化 = 减小 t_*  +  提升 N（跳帧）  +  减少串行模型数</text>
</svg>